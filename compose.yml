services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: eros-postgres
    restart: always
    environment:
      POSTGRES_DB: eros
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eros-redis
    ports:
      - "6379:6379"
    restart: always

  chat-service:
    build: ./src/server/chatService
    container_name: eros-chat
    ports:
      - "8005:8005"
    depends_on:
      - postgres
      - redis
    restart: always

  auth-service:
    build: ./src/server/authService
    container_name: eros-auth
    ports:
      - "8006:8006"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: