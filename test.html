<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EORS Chat Tester - Chuẩn 100% với service mới</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; }
    .header { background: linear-gradient(135deg, #ff6b6b, #ff8e53); color: white; padding: 25px; text-align: center; font-size: 28px; font-weight: bold; }
    .controls { padding: 20px; background: #fff8e1; text-align: center; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
    select, input, button { padding: 14px; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; }
    button { background: #ff6b6b; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #ff5252; }
    .status { font-weight: bold; color: #ff6b6b; min-width: 200px; }
    .chat-box { height: 550px; overflow-y: auto; padding: 20px; background: #fdfdfd; display: flex; flex-direction: column; gap: 12px; }
    .message { padding: 14px 20px; border-radius: 22px; max-width: 70%; word-wrap: break-word; line-height: 1.5; }
    .me { background: #ff6b6b; color: white; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 4px; }
    .other { background: #e0e0e0; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
    .input-area { display: flex; padding: 20px; background: white; border-top: 1px solid #eee; gap: 12px; }
    input { flex: 1; }
    .typing { font-style: italic; color: #888; padding: 0 20px; align-self: flex-start; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">EORS CHAT TESTER - Real-time như Tinder</div>
    
    <div class="controls">
      <div>
        <label>User ID:</label>
        <select id="userId">
          <option value="1">User 1 (Lan)</option>
          <option value="2">User 2 (Minh)</option>
          <option value="3">User 3 (Hùng)</option>
        </select>
      </div>
      <div>
        <label>Match ID:</label>
        <input type="number" id="matchId" value="1" style="width: 90px; text-align:center;">
      </div>
      <button onclick="connect()">KẾT NỐI</button>
      <span id="status" class="status">Chưa kết nối</span>
    </div>

    <div id="chatBox" class="chat-box"></div>
    <div id="typing" class="typing"></div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()">Gửi</button>
    </div>
  </div>

  <script>
    let socket;
    const chatBox = document.getElementById('chatBox');
    const status = document.getElementById('status');
    const typing = document.getElementById('typing');
    let currentUserId = null;
    let currentMatchId = null;

    function connect() {
      currentUserId = parseInt(document.getElementById('userId').value);
      currentMatchId = parseInt(document.getElementById('matchId').value);

      if (socket) socket.close();

      socket = io('http://localhost:8005');

      socket.on('connect', () => {
        status.textContent = `Đã kết nối - User ${currentUserId}`;
        status.style.color = '#4CAF50';

        socket.emit('join', currentUserId);
        socket.emit('join_match', currentMatchId);

        addMessage('Hệ thống', `Đã vào phòng chat #${currentMatchId}`, 'other');

        // TỰ ĐỘNG LẤY TIN NHẮN CŨ KHI VÀO PHÒNG
        socket.emit('get_messages', currentMatchId);
      });

      socket.on('disconnect', () => {
        status.textContent = 'Mất kết nối!';
        status.style.color = 'red';
      });

      // Nhận tin nhắn cũ
      socket.on('previous_messages', (messages) => {
        chatBox.innerHTML = ''; // xóa tin cũ trước
        messages.forEach(msg => {
          const isMe = msg.from_user_id == currentUserId;
          addMessage(msg.sender_name || `User ${msg.from_user_id}`, msg.content || '[ảnh]', isMe ? 'me' : 'other');
        });
      });

      // Nhận tin nhắn mới (từ mình hoặc người kia)
      socket.on('new_message', (msg) => {
        const isMe = msg.from_user_id == currentUserId;
        addMessage(msg.sender_name || `User ${msg.from_user_id}`, msg.content || '[ảnh]', isMe ? 'me' : 'other');
      });

      // Typing indicator
      socket.on('user_typing', ({ userId, isTyping }) => {
        if (userId != currentUserId) {
          typing.textContent = isTyping ? 'Đối phương đang nhập...' : '';
        }
      });
    }

    function addMessage(name, text, type) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.innerHTML = `<strong>${name}:</strong> ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      if (!content || !socket?.connected) return;

      // HIỆN NGAY TIN NHẮN CỦA MÌNH TRƯỚC (UX mượt như Tinder)

      socket.emit('send_message', {
        matchId: currentMatchId,
        fromUserId: currentUserId,
        content: content
      });

      input.value = '';
    }

    // Gửi typing event
    document.getElementById('messageInput').addEventListener('input', function() {
      socket.emit('typing', {
        matchId: currentMatchId,
        isTyping: this.value.length > 0
      });
    });
  </script>
</body>
</html>
