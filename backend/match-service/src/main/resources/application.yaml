server:
  port: 8010

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/eros
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  redis:
    host: redis
    port: 6379

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
